<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ziggy Discos · Tienda de discos en La Latina, Madrid</title>
    <meta
      name="description"
      content="Vinilos nuevos y de segunda mano en el centro de Madrid."
    />
    <link rel="icon" href="img/favicon.svg" type="image/svg+xml" />

    <!--Modo oscuro guardado-->
    <script>
      if (localStorage.getItem("tema") === "oscuro")
        document.documentElement.classList.add("dark");
    </script>

    <!--Tipografías-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Bowlby+One+SC&amp;display=swap"
      rel="stylesheet"
    />

    <!--CSS de las librerías-->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css"
    />

    <!--CSS propio-->
    <link rel="stylesheet" href="css/styles.css" />

    <!--Tailwind desde el CDN-->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!--Sistema de diseño (SOFI)-->
    <style type="text/tailwindcss">
      @custom-variant dark (&:where(.dark, .dark *));

      @theme static {
        /*Tipografías*/
        --font-titulo: "Bowlby One SC", sans-serif;
        --font-cuerpo: "Inter", sans-serif;

        /*Colores de marca*/
        --color-rojo: #d62b1a;
        --color-rojo-oscuro: #a81f10;
        --color-ocre: #f2b233;
        --color-tinta: #141210;
        --color-crema: #fff8ea;
        --color-papel: #faf7f0;
        --color-azul: #1f4ba5;
        --color-verde: #2e6b4f;

        /*Colores por función (cambian en modo oscuro en styles.css)*/
        --color-fondo: #e8e6e2;
        --color-tarjeta: #f8f7f4;
        --color-panel: #f1efeb;
        --color-texto: #141210;
        --color-tenue: #57534d;
        --color-sombra: rgb(20 18 16 / 0.22);

        /*Sombras*/
        --shadow-suave: 5px 5px 20px var(--color-sombra);
      }
    </style>
  </head>

  <body class="bg-fondo font-cuerpo text-texto">
    <!--CABECERA (SOFI)-->

    <main class="bg-fondo">
      <!--PORTADA (SOFI)-->

      <!--Cinta de géneros (VICKY)-->

       <div
        class="overflow-hidden bg-rojo py-4 font-titulo text-lg whitespace-nowrap text-crema uppercase lg:text-2xl"
        aria-hidden="true"
      >
        <div class="cinta flex w-max">

          <div class="flex items-center gap-7 pr-7">
            <span>Rock</span><span class="text-ocre">●</span><span>Indie</span
            ><span class="text-ocre">●</span><span>Electrónica</span
            ><span class="text-ocre">●</span><span>Españoles 80s</span
            ><span class="text-ocre">●</span><span>Soul</span
            ><span class="text-ocre">●</span><span>Latina</span
            ><span class="text-ocre">●</span><span>Nuevo y segunda mano</span
            ><span class="text-ocre">●</span><span>Ferias de vinilo</span
            ><span class="text-ocre">●</span>
          </div>

          <div class="flex items-center gap-7 pr-7">
            <span>Rock</span><span class="text-ocre">●</span><span>Indie</span
            ><span class="text-ocre">●</span><span>Electrónica</span
            ><span class="text-ocre">●</span><span>Españoles 80s</span
            ><span class="text-ocre">●</span><span>Soul</span
            ><span class="text-ocre">●</span><span>Latina</span
            ><span class="text-ocre">●</span><span>Nuevo y segunda mano</span
            ><span class="text-ocre">●</span><span>Ferias de vinilo</span
            ><span class="text-ocre">●</span>
          </div>

        </div>

      </div>

      <!--Azulejos de género (VICKY)-->
            <section
        class="mx-auto flex max-w-6xl snap-x gap-4 overflow-x-auto px-5 pt-8 pb-10 md:grid md:grid-cols-3 md:overflow-visible lg:gap-5 lg:px-10 lg:pt-14 lg:pb-16"
        aria-labelledby="titulo-generos"> 

      <h2 id="titulo-generos" class="sr-only">Géneros</h2>

        <a
          href="#catalogo"
          data-genero="rock"
          data-aos="fade-up"
          class="azulejo relative flex h-36 min-w-56 snap-start flex-col justify-between overflow-hidden rounded-2xl p-5 font-titulo text-3xl uppercase shadow-suave transition hover:-translate-y-1 focus-visible:-translate-y-1 md:min-w-0 lg:h-44 bg-rojo text-crema"
        >
          <span class="font-cuerpo text-sm font-bold">3 discos</span>
          <span class="relative z-10">Rock</span>
          <span class="vinilo absolute -right-8 -bottom-16 w-36"></span>
        </a>

        <a
          href="#catalogo"
          data-genero="indie"
          data-aos="fade-up"
          class="azulejo relative flex h-36 min-w-56 snap-start flex-col justify-between overflow-hidden rounded-2xl p-5 font-titulo text-3xl uppercase shadow-suave transition hover:-translate-y-1 focus-visible:-translate-y-1 md:min-w-0 lg:h-44 bg-ocre text-tinta"
        >
          <span class="font-cuerpo text-sm font-bold">3 discos</span>
          <span class="relative z-10">Indie</span>
          <span class="vinilo absolute -right-8 -bottom-16 w-36"></span>
        </a>

        <a
          href="#catalogo"
          data-genero="electronica"
          data-aos="fade-up"
          class="azulejo relative flex h-36 min-w-56 snap-start flex-col justify-between overflow-hidden rounded-2xl p-5 font-titulo text-3xl uppercase shadow-suave transition hover:-translate-y-1 focus-visible:-translate-y-1 md:min-w-0 lg:h-44 bg-tinta text-ocre dark:bg-crema dark:text-tinta"
        >
          <span class="font-cuerpo text-sm font-bold">3 discos</span>
          <span class="relative z-10">Electrónica</span>
          <span class="vinilo absolute -right-8 -bottom-16 w-36"></span>
        </a>

      </section>
      <!--PRODUCTOS: CATÁLOGO (VICKY)-->
            <section id="catalogo" class="scroll-mt-20 bg-panel">
        <div
          class="mx-auto flex max-w-6xl flex-col gap-6 px-5 py-12 lg:px-10 lg:py-20"
        >
          <header>
            <p
              class="text-xs font-extrabold tracking-[.14em] text-tenue uppercase"
            >
              Cara A · Pista 01
            </p>
            <h2
              class="mt-2 font-titulo text-5xl text-rojo uppercase lg:text-6xl"
            >
              Catálogo
            </h2>
          </header>

          <div class="flex gap-2 overflow-x-auto">
            
            <button
              type="button"
              class="filtro h-10 flex-none rounded-full bg-fondo px-4 text-sm font-bold transition-colors hover:bg-tarjeta focus-visible:bg-tarjeta aria-pressed:bg-rojo aria-pressed:text-crema"
              data-genero="todos"
              aria-pressed="true"
            >
              Todos
            </button>

            <button
              type="button"
              class="filtro h-10 flex-none rounded-full bg-fondo px-4 text-sm font-bold transition-colors hover:bg-tarjeta focus-visible:bg-tarjeta aria-pressed:bg-rojo aria-pressed:text-crema"
              data-genero="rock"
              aria-pressed="false"
            >
              Rock
            </button>

            <button
              type="button"
              class="filtro h-10 flex-none rounded-full bg-fondo px-4 text-sm font-bold transition-colors hover:bg-tarjeta focus-visible:bg-tarjeta aria-pressed:bg-rojo aria-pressed:text-crema"
              data-genero="indie"
              aria-pressed="false"
            >
              Indie
            </button>

            <button
              type="button"
              class="filtro h-10 flex-none rounded-full bg-fondo px-4 text-sm font-bold transition-colors hover:bg-tarjeta focus-visible:bg-tarjeta aria-pressed:bg-rojo aria-pressed:text-crema"
              data-genero="electronica"
              aria-pressed="false"
            >
              Electrónica
            </button>
            
          </div>

      <!--HORARIO Y UBICACIÓN: LA TIENDA (SERGIO)-->

      <!--NOVEDADES: FERIAS (SERGIO)-->
    </main>

    <!--FOOTER (SERGIO)-->

    <!--Librerías-->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
    <!--JavaScript propio (siempre después)-->
    <script src="js/interfaz.js"></script>
    <script src="js/librerias.js"></script>
  </body>
</html>
